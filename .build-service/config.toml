[sources]
include = [
    "src/**",
    "tests/**",
    "assets/**",
    "aw-gateway.sample.toml",
    "container-agent.sample.toml",
    "Cargo.toml",
    "Cargo.lock",
]
exclude = ["target/**"]

[artifacts]
include = [
    "target/release/aw-gateway",
    "target/release/aw-container-bootstrap",
    "target/release/aw-container-agent",
    "target/release/aw-ssh-command-filter",
]
exclude = ["**/*.d"]

[request]
timeout_sec = 900

[workspace]
reuse = true
id = "aw-gateway"
create = true
ttl_sec = 86400

[output]
stdout_max_lines = 10
stderr_max_lines = 10
stdout_tail_lines = 10
stderr_tail_lines = 10
capture_logs = true
log_dir = "/tmp/build-service-aw-gateway"
