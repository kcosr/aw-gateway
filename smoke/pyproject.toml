[project]
name = "aw-gateway-smoke"
version = "0.1.0"
description = "Controller-driven live smoke harness for aw-gateway remote hosts"
requires-python = ">=3.9"
dependencies = [
  "pytest>=8.0",
  "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
awsmoke = "awsmoke.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
