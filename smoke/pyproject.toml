[project]
name = "aw-gateway-smoke"
version = "0.1.0"
description = "Controller-driven live smoke harness for aw-gateway remote hosts"
requires-python = ">=3.12"
dependencies = [
  "pytest>=8.0",
]

[project.scripts]
awsmoke = "awsmoke.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
