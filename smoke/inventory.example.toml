[defaults]
repo_root = ".."
generated_dir = "generated"
target = "ubuntu"
gateway_config = "etc/gateway.toml"

[hosts.ubuntu]
enabled = true
ssh = "ubuntu"
runtime = "docker"
install_root = "/opt/aw-gateway"
install_mode = "sudo"
requires_sudo = true
config_example = "examples/docker/gateway-remote.toml"
image_context = "examples/docker"
image = "aw-gateway/ubuntu-base:latest"
restricted_user = "awsmoke"
restricted_install_root = "/home/awsmoke/aw-gateway"

[hosts.rocky10]
enabled = true
ssh = "rocky10"
runtime = "podman"
install_root = "/home/kevin/aw-gateway"
install_mode = "user"
requires_sudo = true
config_example = "examples/podman/gateway-remote.toml"
image_context = "examples/podman"
image = "aw-gateway/ubuntu-base:latest"
restricted_user = "awsmoke"
restricted_install_root = "/home/awsmoke/aw-gateway"

[hosts.macos-colima]
enabled = true
ssh = "mac"
runtime = "colima"
install_root = "/Users/kevin/aw-gateway"
install_mode = "user"
requires_sudo = false
config_example = "examples/colima/gateway-local.toml"
image_context = "examples/colima"
image = "aw-gateway/ubuntu-base:latest"
restricted_user = "awsmoke"
restricted_install_root = "/Users/kevin/aw-gateway"
