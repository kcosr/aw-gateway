# Example optional host-sshd restriction. Adjust Match criteria and paths for
# your site, then reload sshd.
#
# This makes normal SSH login for matching users enter aw-gateway instead of a
# host shell. Direct container SSH/SCP/SFTP/VS Code still uses the generated
# ProxyCommand host alias.

Match Group aw-gateway-users
    ForceCommand /opt/aw-gateway/bin/aw-gateway --config /etc/aw-gateway/gateway.toml
    PermitTTY yes
    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    PermitTunnel no
    X11Forwarding no
    AllowAgentForwarding no
