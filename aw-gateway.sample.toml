schema_version = "1"
default_target = "default"

[runtime]
type = "podman"

[logging]
level = "info"
console = true

# Optional delegated runtime context declarations. Trusted callers can supply
# values with global --context key=value or --context-file JSON before runtime
# operations. Values are non-secret metadata and may appear in labels/status.
#
# [context_vars.tenant]
# required = true
# format = "slug"
# description = "Delegated tenant namespace."
#
# [context_vars.workspace]
# required = true
# format = "slug"

# Optional JSON HTTP API daemon. Unauthenticated listeners must stay on
# loopback; non-loopback listeners require bearer auth.
#
# [http]
# enabled = true
# listen = "127.0.0.1:8080"
# enabled_actions = ["status", "targets"]
#
# [http.auth]
# type = "bearer"
# token = "change-me"

[target_defaults.workspace]
path = "workspace"
# Optional: mount the host workspace somewhere other than container_home.
# container_path = "/home/{user}/shared"
state_dir = ".aw-gateway"
cleanup = "never"

[targets.default]
image = "ubuntu/dev"
mode = "fixed"
name = "{image_slug}"
# Optional allow-list of non-secret aw-gateway process environment variables
# copied into gateway-managed command execution. Do not use this for tokens or
# other high-value secrets with host-sensitive env names such as PATH,
# LD_PRELOAD, or DOCKER_HOST because those values are passed as runtime argv.
# session_env_inherit = ["GIT_ASKPASS", "GIT_TERMINAL_PROMPT"]
