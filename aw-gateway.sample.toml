schema_version = "1"
default_target = "default"

[runtime]
type = "podman"

[logging]
level = "info"
console = true

# Optional JSON HTTP API daemon. Keep the listener on loopback or behind an
# external authentication boundary. Use bearer auth unless another boundary is
# already enforcing access.
#
# [http]
# enabled = true
# listen = "127.0.0.1:8080"
# enabled_actions = ["status", "targets"]
#
# [http.auth]
# type = "bearer"
# token = "change-me"

[target_defaults.workspace]
path = "workspace"
state_dir = ".aw-gateway"
cleanup = "never"

[targets.default]
image = "ubuntu/dev"
mode = "fixed"
name = "{image_slug}"
