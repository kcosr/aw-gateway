name: Access Runtime Pin

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Access Runtime pin validator
        run: python3 scripts/test-access-runtime-pin.py
      - name: Reproduce pinned Access Runtime build
        run: scripts/check-access-runtime-pin.sh
