[package]
name = "aw-gateway"
version = "0.9.0"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "aw-gateway"
path = "src/bin/aw-gateway.rs"

[[bin]]
name = "aw-container-agent"
path = "src/bin/aw-container-agent.rs"

[[bin]]
name = "aw-container-bootstrap"
path = "src/bin/aw-container-bootstrap.rs"

[[bin]]
name = "aw-ssh-command-filter"
path = "src/bin/aw-ssh-command-filter.rs"

[dependencies]
access-async-contracts = { git = "https://github.com/kcosr/access-runtime.git", rev = "52ad634fc1efccb62bf967f441a0047d56c1f425" }
access-flow-relay = { git = "https://github.com/kcosr/access-runtime.git", rev = "52ad634fc1efccb62bf967f441a0047d56c1f425" }
access-flow-unix = { git = "https://github.com/kcosr/access-runtime.git", rev = "52ad634fc1efccb62bf967f441a0047d56c1f425" }
access-identity = { git = "https://github.com/kcosr/access-runtime.git", rev = "52ad634fc1efccb62bf967f441a0047d56c1f425" }
anyhow = "1.0.100"
axum = { version = "0.8.7", features = ["ws"] }
clap = { version = "4.5.53", features = ["derive", "env"] }
form_urlencoded = "1.2.2"
futures-util = "0.3.32"
glob = "0.3.2"
getrandom = "0.3.4"
libc = "0.2.177"
portable-pty = "0.9"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
shell-words = "1.1.0"
tokio = { version = "1.48.0", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7.18"
toml = "0.9.8"
tracing = "0.1.41"
tracing-appender = "0.2.4"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }

[dev-dependencies]
assert_cmd = "2.1.1"
predicates = "3.1.3"
tempfile = "3.23.0"
tokio-tungstenite = "0.29.0"
tower = { version = "0.5.2", features = ["util"] }
